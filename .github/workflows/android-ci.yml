name: Android CI

on:
  push:
    branches: [main, "melhoria/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes, lint e APK de debug
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Publicar relatórios em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-android
          path: |
            app/build/reports/
            app/build/test-results/
